name: codeql-python-via-box64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  codeql:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Force CodeQL to use native ARM64 Java
        shell: bash
        run: |
          set -euo pipefail
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          echo "CODEQL_JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
          echo "Using CODEQL_JAVA_HOME=$JAVA_HOME_DIR"
          "$JAVA_BIN" -version          
      
      - name: Create CodeQL database (Python)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf codeql-db
          /home/particle/codeql/codeql database create codeql-db \
            --language=python \
            --source-root .

      - name: Analyze -> SARIF
        shell: bash
        run: |
          set -euo pipefail
          /home/particle/codeql/codeql database analyze codeql-db \
            codeql/python-queries \
            --format=sarifv2.1.0 \
            --output=codeql-results.sarif \
            --sarif-category=codeql \
            --threads=0 \
            --download

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results.sarif
