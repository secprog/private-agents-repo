name: codeql-python-via-box64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  codeql:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Add preinstalled CodeQL to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "/home/particle/codeql" >> "$GITHUB_PATH"
          codeql version
          
      - name: Create CodeQL database (Python)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf codeql-db
          codeql database create codeql-db \
            --language=python \
            --source-root .

      - name: Analyze -> SARIF
        shell: bash
        run: |
          set -euo pipefail
          codeql database analyze codeql-db \
            codeql/python-queries \
            --format=sarifv2.1.0 \
            --output=codeql-results.sarif \
            --sarif-category=codeql \
            --threads=0 \
            --download

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results.sarif
