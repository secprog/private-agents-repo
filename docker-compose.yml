services:
  # PostgreSQL for session management and data storage
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER:-agent-platform-postgres}
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent-network


  # Main Orchestrator Agent
  orchestrator:
    build: ./agents/orchestrator
    container_name: ${ORCHESTRATOR_CONTAINER:-agent-platform-orchestrator}
    restart: always
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CYBERSECURITY_AGENT_ENDPOINT=${CYBERSECURITY_AGENT_ENDPOINT}
      - ARTIFACT_SERVICE_TYPE=${ARTIFACT_SERVICE_TYPE}
      - ARTIFACT_ROOT_DIR=${ARTIFACT_ROOT_DIR}
    depends_on:
      - postgres
    networks:
      - agent-network
    volumes:
      - ./agents/orchestrator:/app
      - ./artifacts:/artifacts

  # CyberSecurity Agent (Internal - No External Ports)
  cybersecurity-agent:
    build: ./agents/cybersecurity
    container_name: ${CYBERSECURITY_CONTAINER:-agent-platform-cybersecurity}
    restart: always
    ports:
      - "${CYBERSECURITY_PORT:-8001}:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ORCHESTRATOR_ENDPOINT=${ORCHESTRATOR_ENDPOINT}
      - CYBERSECURITY_AGENT_ENDPOINT=${CYBERSECURITY_AGENT_ENDPOINT}
      - ARTIFACT_SERVICE_TYPE=${ARTIFACT_SERVICE_TYPE}
      - ARTIFACT_ROOT_DIR=${ARTIFACT_ROOT_DIR}
    depends_on:
      - orchestrator
    networks:
      - agent-network
    volumes:
      - ./agents/cybersecurity:/app
      - ./artifacts:/artifacts

  # Frontend
  frontend:
    build: ./frontend
    container_name: ${FRONTEND_CONTAINER:-agent-platform-frontend}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_ENDPOINT=${API_ENDPOINT}
    depends_on:
      - orchestrator
    networks:
      - agent-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  agent-network:
    driver: bridge

volumes:
  postgres_data:
