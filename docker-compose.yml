services:
  # PostgreSQL for session management and data storage
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: ${POSTGRES_CONTAINER:-agent-platform-postgres}
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - agent-network

  # Main Orchestrator Agent
  orchestrator:
    build: ./agents/orchestrator
    container_name: ${ORCHESTRATOR_CONTAINER:-agent-platform-orchestrator}
    restart: always
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - OM_BASE_URL=${OM_BASE_URL:-http://openmemory:8080}
      - OM_API_KEY=${OM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CYBERSECURITY_AGENT_ENDPOINT=${CYBERSECURITY_AGENT_ENDPOINT}
      - VISION_AGENT_ENDPOINT=${VISION_AGENT_ENDPOINT}
      - ARTIFACT_SERVICE_TYPE=${ARTIFACT_SERVICE_TYPE}
      - ARTIFACT_ROOT_DIR=${ARTIFACT_ROOT_DIR}
    depends_on:
      - postgres
    networks:
      - agent-network
    volumes:
      - ./agents/orchestrator:/app
      - ./artifacts:/artifacts

  # CyberSecurity Agent (Internal - No External Ports)
  cybersecurity-agent:
    build: ./agents/cybersecurity
    container_name: ${CYBERSECURITY_CONTAINER:-agent-platform-cybersecurity}
    restart: always
    ports:
      - "${CYBERSECURITY_PORT:-8001}:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ORCHESTRATOR_ENDPOINT=${ORCHESTRATOR_ENDPOINT}
      - CYBERSECURITY_AGENT_ENDPOINT=${CYBERSECURITY_AGENT_ENDPOINT}
      - ARTIFACT_SERVICE_TYPE=${ARTIFACT_SERVICE_TYPE}
      - ARTIFACT_ROOT_DIR=${ARTIFACT_ROOT_DIR}
    depends_on:
      - orchestrator
    networks:
      - agent-network
    volumes:
      - ./agents/cybersecurity:/app
      - ./artifacts:/artifacts

  # Vision Agent (Internal - No External Ports)
  vision-agent:
    build: ./agents/vision
    container_name: ${VISION_CONTAINER:-agent-platform-vision}
    restart: always
    ports:
      - "${VISION_PORT:-8002}:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ORCHESTRATOR_ENDPOINT=${ORCHESTRATOR_ENDPOINT}
      - VISION_AGENT_ENDPOINT=${VISION_AGENT_ENDPOINT}
      - ARTIFACT_SERVICE_TYPE=${ARTIFACT_SERVICE_TYPE}
      - ARTIFACT_ROOT_DIR=${ARTIFACT_ROOT_DIR}
    depends_on:
      - orchestrator
    networks:
      - agent-network
    volumes:
      - ./agents/vision:/app
      - ./artifacts:/artifacts

  # Frontend
  frontend:
    build: ./frontend
    container_name: ${FRONTEND_CONTAINER:-agent-platform-frontend}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_ENDPOINT=${API_ENDPOINT}
    depends_on:
      - orchestrator
    networks:
      - agent-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # OpenMemory (CaviraOSS) - cognitive memory engine for AI agents
  # See: https://github.com/CaviraOSS/OpenMemory
  # Setup instructions:
  #   1. Clone: git clone https://github.com/CaviraOSS/OpenMemory.git
  #   2. Set required environment variables in .env file
  #   3. API available at: http://localhost:8080
  # Note: CaviraOSS OpenMemory runs on port 8080 by default
  openmemory:
    build:
      context: ./openmemory/packages/openmemory-js
      dockerfile: Dockerfile
    # Note: Run setup-openmemory script first to clone CaviraOSS OpenMemory backend
    # The backend files will be copied directly to ./openmemory/ after setup
    container_name: ${OPENMEMORY_CONTAINER:-openmemory}
    restart: always
    ports:
      - "${OM_PORT:-8080}:8080"
    environment:
      # Core Configuration (REQUIRED for production)
      - PORT=${OM_PORT:-8080}
      - OM_API_KEY=${OM_API_KEY:-} # REQUIRED for production - API key for authentication
      - OM_TIER=${OM_TIER:-deep} # Performance tier: hybrid, smart, deep, or fast

      # Database Configuration
      - OM_METADATA_BACKEND=${OM_METADATA_BACKEND:-postgres}
      - OM_VECTOR_BACKEND=${OM_VECTOR_BACKEND:-pgvector}

      # Embedding Provider Configuration
      - OM_EMBEDDINGS=${OM_EMBEDDINGS:-openai} # Options: synthetic, openai, gemini, ollama, aws

      # OpenAI Embedding Configuration (REQUIRED if OM_EMBEDDINGS=openai)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-} # REQUIRED for OpenAI embeddings
      - OM_OPENAI_BASE_URL=${OM_OPENAI_BASE_URL:-}

      # PostgreSQL Configuration (if using PostgreSQL for metadata/vector)
      - OM_PG_HOST=${OM_PG_HOST:-postgres}
      - OM_PG_PORT=${OM_PG_PORT:-5432}
      - OM_PG_DB=${POSTGRES_DB:-openmemory}
      - OM_PG_USER=${POSTGRES_USER:-}
      - OM_PG_PASSWORD=${POSTGRES_PASSWORD:-}
      - OM_VECTOR_TABLE=vectors # Must match PostgresVectorStore hardcoded table name

      # Background Process Configuration
      - OM_AUTO_REFLECT=${OM_AUTO_REFLECT:-true}
      - OM_REFLECT_INTERVAL=${OM_REFLECT_INTERVAL:-3600}
      - OM_REFLECT_MIN_MEMORIES=${OM_REFLECT_MIN_MEMORIES:-10}
      - OM_USER_SUMMARY_INTERVAL=${OM_USER_SUMMARY_INTERVAL:-86400}
      - OM_USE_SUMMARY_ONLY=${OM_USE_SUMMARY_ONLY:-false}
      - OM_SUMMARY_MAX_LENGTH=${OM_SUMMARY_MAX_LENGTH:-2000}

      # Memory Decay Configuration
      - OM_DECAY_LAMBDA=${OM_DECAY_LAMBDA:-0.1}
      - OM_DECAY_INTERVAL_MINUTES=${OM_DECAY_INTERVAL_MINUTES:-60}
      - OM_DECAY_RATIO=${OM_DECAY_RATIO:-0.1}
      - OM_DECAY_SLEEP_MS=${OM_DECAY_SLEEP_MS:-100}
      - OM_DECAY_THREADS=${OM_DECAY_THREADS:-4}
      - OM_DECAY_COLD_THRESHOLD=${OM_DECAY_COLD_THRESHOLD:-0.1}
      - OM_DECAY_REINFORCE_ON_QUERY=${OM_DECAY_REINFORCE_ON_QUERY:-true}

    networks:
      - agent-network
    volumes:
      - openmemory_data:/data
      # Mount the backend code for development (if needed)
      # - ./openmemory/backend:/usr/src/openmemory
    depends_on:
      - postgres

networks:
  agent-network:
    driver: bridge

volumes:
  postgres_data:
  openmemory_data:
